<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Al-Bayada Chat Apps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: same Al-Bayada system as Streaming, Music and AI pages — dark screen, header nav, a category hero, then a "coming soon" shelf where the app cards will go */
:root{
  --bg:#0b0b10; --panel:#14141d; --line:#23232f; --fg:#ffffff; --muted:#b9b9c6;
  --accent:#25d3a0; --c:#ff6fb5; --ink:#2a0618;
  --display:Impact,'Arial Black','Haettenschweiler',sans-serif;
  --body:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding-block:16px;gap:16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:.5px;color:var(--fg);text-decoration:none}
.logo span{color:var(--accent)}
.sitenav{display:flex;flex-wrap:nowrap;gap:18px;overflow-x:auto;min-width:0;max-width:100%;white-space:nowrap;scrollbar-width:none;font-size:.9rem;color:var(--muted)}
.sitenav::-webkit-scrollbar{display:none}
.sitenav a{flex:none;color:inherit;text-decoration:none;padding-block:4px}
.sitenav a:hover,.sitenav a:focus-visible{color:var(--fg)}
.sitenav a[aria-current]{color:var(--fg);font-weight:700;box-shadow:inset 0 -2px var(--accent)}
@media (max-width:1000px){.sitenav{width:100%}}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.hero{position:relative;border-radius:26px;overflow:hidden;padding:clamp(28px,6vw,64px) clamp(20px,6vw,64px);
  background:radial-gradient(circle at 85% 20%,color-mix(in srgb,var(--c) 45%,#0b0b10) 0,color-mix(in srgb,var(--c) 14%,#0b0b10) 45%,#0b0b10 100%);
  border:1px solid var(--line)}
.hero>*{position:relative;z-index:1;min-width:0}
.tag{display:inline-block;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.12);margin-bottom:16px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.8rem,10vw,6rem);line-height:.92;letter-spacing:3px;color:var(--c);text-shadow:0 0 30px color-mix(in srgb,var(--c) 45%,transparent);text-wrap:balance;max-width:12ch}
.quote{font-size:clamp(1.05rem,2.4vw,1.45rem);font-style:italic;line-height:1.4;margin-top:16px;max-width:32ch}
.sub{color:var(--muted);margin-top:12px;line-height:1.5;max-width:52ch}
.emo{position:absolute;right:4%;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:clamp(6rem,20vw,13rem);opacity:.25;z-index:0;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-55%) rotate(4deg)}}

.soon{margin-block:28px 70px;display:flex;flex-direction:column;gap:18px}
.soon h2{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800}
.soon h2 span{color:var(--accent)}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.ghost{height:230px;border-radius:22px;border:2px dashed var(--line);background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.015) 14px 28px);display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:18px}
.ghost i{display:block;height:12px;border-radius:6px;background:var(--line)}
.ghost i:first-child{width:60%;height:18px;background:color-mix(in srgb,var(--c) 25%,var(--line))}
.ghost i:last-child{width:40%}
.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-radius:22px;background:var(--panel);border:1px solid var(--line)}
.note>div{min-width:0}
.note small{display:block;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-size:.75rem;margin-bottom:4px}
.note p{line-height:1.5;max-width:46ch}
.wa{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.wa b{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,5vw,2.2rem);letter-spacing:2px;color:#25d366;user-select:all}
.wa a,.wa button{padding:11px 20px;border-radius:99px;border:0;font:700 .92rem var(--body);cursor:pointer;text-decoration:none}
.wa a{background:#25d366;color:#04210f}
.wa button{background:#1e1e2a;color:var(--fg);border:1px solid var(--line)}
@media (max-width:900px){.shelf{grid-template-columns:repeat(2,1fr)}.ghost{height:170px}}
@media (max-width:520px){.shelf .ghost:nth-child(n+3){display:none}}
@media (prefers-reduced-motion:reduce){.emo{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="logo" href="index.html">Al-<span>Bayada</span></a>
</header>

<section class="hero" aria-label="Chat Apps">
  <span class="emo" aria-hidden="true">💬</span>
  <span class="tag">Chat Apps</span>
  <h1>CHAT ON</h1>
  <p class="quote">“Coins for the chats that keep you up at night.”</p>
  <p class="sub">Lovala, ShowGo, SUGO LIVE and more.</p>
</section>

<section class="soon" aria-label="Coming soon">
  <h2>Chat Apps <span>coming soon</span></h2>
  <div class="shelf" aria-hidden="true">
    <div class="ghost"><i></i><i></i><i></i></div>
    <div class="ghost"><i></i><i></i><i></i></div>
    <div class="ghost"><i></i><i></i><i></i></div>
    <div class="ghost"><i></i><i></i><i></i></div>
  </div>
  <div class="note">
    <div>
      <small>Need it now?</small>
      <p>We're still building this page, but you can already order. Send us the app name on WhatsApp.</p>
    </div>
    <div class="wa">
      <b id="num">71 799 990</b>
      <button type="button" id="copy">Copy</button>
      <a href="https://wa.me/96171799990?text=Hi%20Al-Bayada,%20I%20want%20to%20ask%20about%20Chat%20Apps" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>
</section>
</div>
<script>
document.getElementById('copy').addEventListener('click',function(){
  var b=this;
  function done(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1500)}
  function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById('num'));var s=getSelection();s.removeAllRanges();s.addRange(r)}
  try{navigator.clipboard.writeText('71799990').then(done,sel)}catch(e){sel()}
});
</script>
</body>
</html>
